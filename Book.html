<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Tracker</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="hidden" id="main-header">
      <a href="#" id="nav-home">Home</a>
      <a href="#" id="nav-logged-books">Logged Books</a>
      <a href="#" id="nav-explore">Explore</a>
      </nav>
    </header>


<!-- FORM PAGE -->
 

    <section id="form-view" class="hidden">
      <h2 id="log-book">Log Book</h2>
      <form id="form">
        <label>Title:</label>
        <input id="book-title" name="book-name" placeholder="Book Title" />

        <br />

        <label>Author:</label>
        <input id="book-author" name="author" placeholder="Book Author" />

        <br />

        <label>Year:</label>
        <input
          type="number"
          id="book-year"
          name="book-year"
          placeholder="Book Year"
        />

        <br />
        <label>Genre:</label>
        <select id="select-genre" placeholder="Select Genre">
          <option value="">Select Genre</option>
          <option value="non-fiction">Non-Fiction</option>
          <option value="fiction">Fiction</option>
          <option value="mystery">Mystery</option>
          <option value="science-fiction">Science Fiction</option>
          <option value="fantasy">Fantasy</option>
          <option value="history">History</option>
          <option value="romance">Romance</option>
          <option value="thriller">Thriller</option>
          <option value="biography">Biography</option>
          <option value="self-help">Self Help</option>
        </select>
        <br />
        <br />
        <br />
        <button type="button" id="add-book">Add Book</button>
      </form>

      
    </section>


    <!-- LOGGED BOOKS PAGE -->


<section id="logged-books-view" class="hidden">
    <div class="toolbar">
           <select id="select-filter" placeholder="Select Filter">
        <option value="">Select Genre</option>
        <option value="all">All</option>
        <option value="non-fiction">Non-Fiction</option>
        <option value="fiction">Fiction</option>
        <option value="mystery">Mystery</option>
        <option value="science-fiction">Science Fiction</option>
        <option value="fantasy">Fantasy</option>
        <option value="history">History</option>
        <option value="romance">Romance</option>
        <option value="thriller">Thriller</option>
        <option value="biography">Biography</option>
        <option value="self-help">Self Help</option>
      </select>
        <button type="button" id="filter-button">Filter</button>
        
        
    </div>
    <p id="total-books"></p>
    <div id="book-cards"></div>
</section>


<!-- EXPLORE PAGE -->


<section id='explore-page' class="hidden">



<div id="explore-sidebar">

  <input type="search" placeholder="Search Books" id="search-bar">
  <button type="button" id="search-button">Search</button>

</div>

<div id='explore-book-cards'></div> 

</section>

<!-- LOGIN PAGE -->

<section id="login-view">
  <h1>The Book Shelf</h1>
<h2 id="login-page">Login</h2>
<form> 
<label>Username</label>
<input id="username-input"  placeholder="Username">


<label>Password</label>
<input id="password-input" type="password" placeholder="Password">

<button type="button" id="login">Login</button>

<p>Don't have an account? <a href="#" id="go-to-register">Register here</a></p>

</form>

</section>

<!-- REGISTER PAGE -->

<section id="register-view" class="hidden">
<h1>The Book Shelf</h1>
<h2 id="register-page">Register</h2>
<form> 
<label>Username</label>
<input id="register-username" placeholder="Create Username">


<label>Password</label>
<input id="register-password" type="password" placeholder="Create Password">

<button type="button" id="register">Register</button>

<p>Already have an account? <a href="#" id="go-to-login">Login here</a></p>

</form>

</section>


    <script src="js/app.js"></script>
  </body>
</html>
